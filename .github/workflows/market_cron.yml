name: Market Scanner & AI Signal Screener Daily

on:
  schedule:
    # Běh každý den v 8:00 ráno (pokrývá 06:00 UTC v letním čase SELČ i 07:00 UTC v zimním SEČ)
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch: # Umožňuje okamžitý manuální refresh kdykoliv přímo z GitHubu
  push:
    branches:
      - main
      - master

# Nastavení oprávnění pro GitHub Pages a uložení aktualizovaného index.html do repozitáře
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-scanner-cron
  cancel-in-progress: false

jobs:
  scan-and-publish:
    name: Market Scan & Publish to GitHub Pages + Forpsi
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🤖 Run Market Scanner & AI Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          python main.py

      - name: 💾 Commit & Push updated index.html to Repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html
          git diff --staged --quiet || (git commit -m "Auto-update market screener report [skip ci]" && git push)

      - name: 🌐 Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 🌐 Optional Deploy to Forpsi Hosting via FTP
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /www/

